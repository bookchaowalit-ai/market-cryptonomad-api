name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Contracts - compile and test (in-process Hardhat network)
        working-directory: packages/contracts
        run: npx hardhat test

      - name: Shared - typecheck and unit tests
        working-directory: packages/shared
        run: |
          npx tsc --noEmit -p .
          npx vitest run

      - name: Web app - lint and typecheck
        working-directory: packages/web-app
        run: |
          npm run lint
          npx tsc --noEmit -p .
