# Shared CI + security baseline. Public repository: GitHub-hosted runners.
# Same checks as the previous hand-written workflow, run through the shared ci-node workflow
# at the workspace root (npm ci installs every package).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-node.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      node-version: "20"
      lint-command: |
        (cd packages/contracts && npx solhint --max-warnings 0 'contracts/**/*.sol')
        (cd packages/web-app && npm run lint)
      typecheck-command: |
        (cd packages/shared && npx tsc --noEmit -p .)
        (cd packages/web-app && npx tsc --noEmit -p .)
      # Hardhat runs on its in-process network; no RPC, keys or deployments.
      test-command: |
        (cd packages/contracts && npx hardhat test)
        (cd packages/shared && npx vitest run)
        (cd packages/web-app && npx vitest run)

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
